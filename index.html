<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Edytor</title>
    <style>
        body {
            background-color: #d3d3d3;
            font-family: "Times New Roman", Times, serif;
        }

        #container {
            width: fit-content;
            min-width: 500px;
            margin: 20px auto;
            border: 2px solid black;
            background-color: white;
            padding: 15px;
        }

        h1 {
            text-align: center;
            text-decoration: underline;
        }

        #toolbar {
            background-color: #e6e6e6;
            border: 2px outset gray;
            padding: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        #grid {
            display: grid;
            margin: 0 auto;
            border: 3px solid #ff0000;
            user-select: none;
        }

        .cell {
            width: 20px;
            height: 20px;
            background-color: white;
            border: 1px solid gray;
            box-sizing: border-box;
        }

        .hover-preview {
            background-color: yellow !important;
            cursor: pointer;
        }

        #info {
            margin-top: 20px;
            border: 1px dashed black;
            padding: 10px;
            background-color: #ffffcc;
        }

        .info-span {
            font-weight: bold;
            color: red;
        }
    </style>
</head>
<body>

<div id="container">
    <h1>Edytor Pikseli</h1>

    <div id="toolbar">
        <input type="color" id="color-picker" value="#000000">
        <select id="brush-size">
            <option value="1">1x1</option>
            <option value="2">2x2</option>
            <option value="3">3x3</option>
        </select>
        <button id="eraser-btn">Gumka</button>
        <button id="clear-btn">Wyczyść</button>
    </div>

    <div id="grid"></div>

    <div id="info">
        Wiersz: <span id="info-row" class="info-span">–</span> |
        Kolumna: <span id="info-col" class="info-span">–</span> |
        Aktywne komórki: <span id="info-count" class="info-span">0</span>
    </div>
</div>

<script>
    const grid = document.getElementById('grid');
    const colorPicker = document.getElementById('color-picker');
    const brushSizeSelect = document.getElementById('brush-size');
    const eraserBtn = document.getElementById('eraser-btn');
    const clearBtn = document.getElementById('clear-btn');

    const infoRow = document.getElementById('info-row');
    const infoCol = document.getElementById('info-col');
    const infoCount = document.getElementById('info-count');

    const rows = 20;
    const cols = 20;

    let isDrawing = false;
    let isEraser = false;

    grid.style.gridTemplateColumns = `repeat(${cols}, 20px)`;
    grid.style.gridTemplateRows = `repeat(${rows}, 20px)`;
    grid.style.width = `${cols * 20}px`;

    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.setAttribute('data-row', r);
            cell.setAttribute('data-col', c);
            grid.appendChild(cell);
        }
    }

    function updateCount() {
        let count = 0;
        const cells = document.querySelectorAll('.cell');
        cells.forEach(cell => {
            const bg = cell.style.backgroundColor;
            if (bg && bg !== 'white' && bg !== 'rgb(255, 255, 255)') {
                count++;
            }
        });
        infoCount.textContent = count;
    }

    function toggleEraser() {
        isEraser = !isEraser;
        eraserBtn.style.backgroundColor = isEraser ? '#ffb3b3' : '';
    }

    function clearGrid() {
        const cells = document.querySelectorAll('.cell');
        cells.forEach(cell => cell.style.backgroundColor = 'white');
        updateCount();
    }

    // Funkcja realizująca malowanie z uwzględnieniem rozmiaru pędzla.
    // Działa poprzez ustalenie macierzy przesunięć relatywnych względem bazowej komórki,
    // a następnie wyszukuje w DOM sąsiadujące divy za pomocą atrybutów data-row i data-col.
    // Funkcja wyodrębniająca logikę wyznaczania współrzędnych obszaru na podstawie rozmiaru pędzla.
    // Zwraca tablicę elementów DOM, które znajdują się w zasięgu działania.
    function getCellsInBrushArea(cellElement) {
        const baseRow = parseInt(cellElement.getAttribute('data-row'));
        const baseCol = parseInt(cellElement.getAttribute('data-col'));
        const size = parseInt(brushSizeSelect.value);

        let offsets = [];
        if (size === 1) offsets = [[0, 0]];
        else if (size === 2) offsets = [[0, 0], [0, 1], [1, 0], [1, 1]];
        else if (size === 3) offsets = [[-1, -1], [-1, 0], [-1, 1], [0, -1], [0, 0], [0, 1], [1, -1], [1, 0], [1, 1]];

        const targets = [];
        offsets.forEach(offset => {
            const target = document.querySelector(`.cell[data-row="${baseRow + offset[0]}"][data-col="${baseCol + offset[1]}"]`);
            if (target) targets.push(target);
        });
        return targets;
    }

    function paintArea(cellElement) {
        if (!cellElement.classList.contains('cell')) return;
        const targets = getCellsInBrushArea(cellElement);
        targets.forEach(target => {
            target.style.backgroundColor = isEraser ? 'white' : colorPicker.value;
        });
        updateCount();
    }

    grid.addEventListener('mouseover', (e) => {
        if (e.target.classList.contains('cell')) {
            infoRow.textContent = e.target.getAttribute('data-row');
            infoCol.textContent = e.target.getAttribute('data-col');

            document.querySelectorAll('.hover-preview').forEach(c => c.classList.remove('hover-preview'));

            const targets = getCellsInBrushArea(e.target);
            targets.forEach(target => target.classList.add('hover-preview'));
        }
    });

    grid.addEventListener('mouseout', (e) => {
        if (e.target.classList.contains('cell')) {
            document.querySelectorAll('.hover-preview').forEach(c => c.classList.remove('hover-preview'));
        }
    });

    // 1. ZDARZENIA ZAREJESTROWANE PRZEZ addEventListener (Minimum 5)

    // Delegacja zdarzeń (Event Delegation)
    // Zamiast podłączać setki oddzielnych listenerów do każdej z komórek, przypinamy pojedynczy nasłuchiwacz
    // na cały kontener (#grid). Podczas wystąpienia zdarzenia (np. kliknięcia), sprawdzamy e.target,
    // aby upewnić się, czy faktycznie kliknięto dziecko posiadające klasę '.cell'.
    grid.addEventListener('mousedown', (e) => {
        if (e.target.classList.contains('cell')) {
            isDrawing = true;
            paintArea(e.target);
        }
    });

    grid.addEventListener('mousemove', (e) => {
        if (isDrawing && e.target.classList.contains('cell')) {
            paintArea(e.target);
        }
    });

    grid.addEventListener('mouseover', (e) => {
        if (e.target.classList.contains('cell')) {
            infoRow.textContent = e.target.getAttribute('data-row');
            infoCol.textContent = e.target.getAttribute('data-col');
        }
    });

    grid.addEventListener('click', (e) => {
        if (e.target.classList.contains('cell')) {
            e.target.style.backgroundColor = isEraser ? 'white' : colorPicker.value;
            updateCount();
        }
    });

    grid.addEventListener('dblclick', (e) => {
        if (e.target.classList.contains('cell')) {
            const rowIdx = e.target.getAttribute('data-row');
            const rowCells = document.querySelectorAll(`.cell[data-row="${rowIdx}"]`);
            rowCells.forEach(c => c.style.backgroundColor = isEraser ? 'white' : colorPicker.value);
            updateCount();
        }
    });

    grid.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        if (e.target.classList.contains('cell')) {
            e.target.style.backgroundColor = 'white';
            updateCount();
        }
    });

    document.addEventListener('mouseup', () => {
        isDrawing = false;
    });

    clearBtn.addEventListener('click', clearGrid);


    // 2. ZDARZENIA ZAREJESTROWANE PRZEZ SKŁADNIĘ on-property (Minimum 3)

    document.onkeydown = (e) => {
        const key = e.key.toUpperCase();
        if (key === 'E') {
            toggleEraser();
        } else if (key === 'C') {
            clearGrid();
        } else if (key === '1' || key === '2' || key === '3') {
            brushSizeSelect.value = key;
        }
    };

    colorPicker.oninput = (e) => {
        isEraser = false;
        eraserBtn.style.backgroundColor = '';
    };

    brushSizeSelect.onchange = (e) => {
        // Logika rozmiaru obsłużona w głównej funkcji paintArea
    };

    eraserBtn.onclick = toggleEraser;

</script>
</body>
</html>
